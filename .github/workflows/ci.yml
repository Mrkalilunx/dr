name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMGR="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n1)"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: gradle assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/dr.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr
          path: dist/dr.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dr-latest
          name: dr latest
          files: dist/dr.apk
          make_latest: true
